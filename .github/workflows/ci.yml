name: CI

# The C++ build and the test suites used to live in one `build-and-test` job.
# That job ran build (~6-9.5 min), `ctest` (~22-39 min) and the blackbox suite
# (~11-13 min) strictly in sequence, so its wall clock was the *sum* of all
# three -- and on 2026-08-30 run 33337729995 was cancelled by the 60-minute
# `timeout-minutes` partway through the blackbox suite, needing ~71 minutes.
#
# The measured per-step numbers behind the split below (cancelled run
# 33337729995 / successful run 33322429959):
#
#   install deps            10 s  /   10 s
#   install pinned CMake     2 s  /    2 s
#   configure main project   6 s  /    5 s
#   build main project     564 s  /  366 s
#   ctest (serial)        2314 s  / 1314 s
#   configure blackbox       0 s  /    0 s
#   build blackbox           7 s  /    7 s
#   run blackbox           707 s+ /  649 s
#
# and inside that serial `ctest`, per suite (cancelled / successful):
#
#   lexer_test               0 s  /    0 s
#   parser_test             11 s  /    8 s
#   codegen_test           145 s  /   77 s
#   movecheck_test         744 s  /  392 s
#   driver_test           1405 s  /  833 s
#   httpserver_test          8 s  /    5 s
#
# So the build is a small part of the cost and the tests are ~90% of it, with
# `driver_test` alone worth 61% of `ctest`. The structure that follows is
# therefore: build once, hand the finished build tree to the test jobs as an
# artifact, and run the unit-test shards and the blackbox suite concurrently.
#
# Handing the tree over rather than rebuilding it is the whole point: separate
# jobs get separate machines and separate filesystems, so a naive "one job
# builds, another runs ctest" split would pay the 6-9.5 minute C++26-modules +
# LLVM build again in every test job and end up slower, not faster. Packing the
# tree costs ~4 s (514 MB -> 175 MB with `gzip -1`) plus the artifact
# round-trip, against 6-9.5 minutes of rebuild.
#
# No suite, case or compiler flag changed here: `ctest` still runs all six
# tests, the blackbox runner still runs its whole corpus, and the build still
# uses the same `-Werror` configuration.
#
# The resulting graph is:
#
#   workflow-scope -> build -> unit-tests (3 shards) --\
#                          \-> blackbox-tests ----------> build-and-test
#                                                            |
#                                                  docker-website-smoke
#                                                            |
#                                                 publish-website-image
#
# `build-and-test` survives as the aggregating gate rather than as the job
# that does the work, because `main`'s branch protection requires the status
# checks `build-and-test` and `docker-website-smoke` by name.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Answers, exactly once for the whole workflow, the two questions every
  # downstream job needs answered the same way: "is this a docs-only change
  # set?" and "which unit tests belong to which shard?". Both are exposed as
  # job outputs, so the other jobs consume one answer instead of each
  # recomputing its own and risking a disagreement.
  workflow-scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.change-scope.outputs.docs_only }}
      unit_test_shards: ${{ steps.shard-map.outputs.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: change-scope
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false
          base_sha=""
          head_sha=""
          zero_sha=0000000000000000000000000000000000000000

          case "${{ github.event_name }}" in
            pull_request)
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.event.after }}"
              ;;
          esac

          if [ -n "${base_sha}" ] && [ -n "${head_sha}" ] && [ "${base_sha}" != "${zero_sha}" ] &&
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null &&
             git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")
            if [ "${#changed_files[@]}" -gt 0 ]; then
              docs_only=true
              for path in "${changed_files[@]}"; do
                if [[ "${path}" != docs/* ]]; then
                  docs_only=false
                  break
                fi
              done
            fi
          fi

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

      - name: Report docs-only fast path
        if: steps.change-scope.outputs.docs_only == 'true'
        run: echo "Docs-only change set detected; skipping build and test steps."

      # The single source of truth for how `ctest`'s tests are divided across
      # the `unit-tests` matrix. The matrix is built from this output with
      # `fromJSON`, *and* the build job checks this same output against the
      # test list `ctest` actually declares -- so the map that schedules the
      # shards and the map that is audited for coverage cannot drift apart.
      #
      # Shards are grouped by measured cost, not alphabetically: `driver_test`
      # (833-1405 s) and `movecheck_test` (392-744 s) each get a shard to
      # themselves and everything else (<170 s combined) shares the third, so
      # the wall clock of this stage is one `driver_test`, not the sum.
      - name: Publish the unit-test shard map
        id: shard-map
        shell: bash
        run: |
          set -euo pipefail
          shards='[{"name":"driver","tests":"driver_test"},{"name":"movecheck","tests":"movecheck_test"},{"name":"frontend","tests":"lexer_test parser_test codegen_test httpserver_test"}]'
          python3 -c 'import json,sys; json.loads(sys.argv[1])' "${shards}"
          echo "shards=${shards}" >> "${GITHUB_OUTPUT}"

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: workflow-scope
    env:
      CC: clang-22
      CXX: clang++-22
      LLVM_CMAKE_DIR: /usr/lib/llvm-22/lib/cmake/llvm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up the scpp C++ toolchain
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-cxx-toolchain

      - name: Configure main project
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: |
          set -euxo pipefail
          # Confirm which cmake actually resolves in PATH, so any future
          # drift (e.g. a new runner image shadowing the pin again) is
          # immediately visible in the CI log rather than failing opaquely.
          which cmake
          cmake --version
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${LLVM_CMAKE_DIR}"

      - name: Build main project
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: cmake --build build

      - name: Configure blackbox test runner
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: cmake -S blackbox_test -B blackbox_test/build

      - name: Build blackbox test runner
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: cmake --build blackbox_test/build

      # Coverage audit for the shard map. A shard that silently runs zero
      # tests, or a newly added `add_test` that no shard claims, would both
      # otherwise show up as a green run that tested less than it looked like
      # it did. This compares the shard map against `ctest`'s own declared
      # test list and fails on any test that is unassigned, assigned twice, or
      # assigned but not declared.
      - name: Verify the shard map covers every declared unit test
        if: needs.workflow-scope.outputs.docs_only != 'true'
        env:
          UNIT_TEST_SHARDS: ${{ needs.workflow-scope.outputs.unit_test_shards }}
        run: |
          set -euo pipefail
          ctest --test-dir build --show-only=json-v1 > build/ctest-declared-tests.json
          python3 <<'PY'
          import json
          import os

          with open("build/ctest-declared-tests.json", encoding="utf-8") as handle:
              declared = sorted(test["name"] for test in json.load(handle)["tests"])

          assigned = [
              name
              for shard in json.loads(os.environ["UNIT_TEST_SHARDS"])
              for name in shard["tests"].split()
          ]

          problems = []
          if not declared:
              problems.append("ctest declared no tests at all")
          duplicated = sorted({name for name in assigned if assigned.count(name) > 1})
          if duplicated:
              problems.append(f"assigned to more than one shard: {duplicated}")
          unassigned = sorted(set(declared) - set(assigned))
          if unassigned:
              problems.append(f"declared by ctest but claimed by no shard: {unassigned}")
          unknown = sorted(set(assigned) - set(declared))
          if unknown:
              problems.append(f"claimed by a shard but not declared by ctest: {unknown}")

          if problems:
              for problem in problems:
                  print(f"::error::unit-test shard map: {problem}")
              raise SystemExit(1)

          print(f"shard map covers all {len(declared)} declared tests: {', '.join(declared)}")
          PY

      # Both build trees travel to the test jobs as one gzipped tar rather than
      # as a raw directory upload. Two reasons, both load-bearing:
      #
      #   * `actions/upload-artifact` normalises file modes, so a directory
      #     upload would hand the test jobs non-executable `scpp`,
      #     `driver_test`, `run_tests`, ... A tar preserves the mode bits.
      #   * The tree is ~514 MB across tens of thousands of small object and
      #     module files; one 175 MB stream moves far faster than that many
      #     individual entries. `compression-level: 0` on the upload stops the
      #     action from re-compressing an already-compressed tar.
      #
      # `build/.ci-workspace-path` records where the tree was built. CMake and
      # Ninja bake absolute paths into CMakeCache.txt, CTestTestfile.cmake and
      # driver_test's own SCPP_BINARY_PATH/SCPP_*_SOURCE_DIR defines, so this
      # relocation only works because every job in a run gets the identical
      # /home/runner/work/scpp/scpp workspace. That is true today, and the
      # marker turns "if it ever stops being true" from a baffling
      # file-not-found deep inside a test into an explicit CI error.
      - name: Package the build tree for the test jobs
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: |
          set -euxo pipefail
          printf '%s\n' "${GITHUB_WORKSPACE}" > build/.ci-workspace-path
          tar -I 'gzip -1' -cf build-tree.tar.gz build blackbox_test/build
          ls -l build-tree.tar.gz

      - name: Upload the build tree
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-tree
          path: build-tree.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  unit-tests:
    name: unit-tests (${{ matrix.shard.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    needs:
      - workflow-scope
      - build
    strategy:
      # Every shard reports its own result: a red `driver` shard must not hide
      # a red `movecheck` one.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.workflow-scope.outputs.unit_test_shards) }}
    env:
      CC: clang-22
      CXX: clang++-22
      LLVM_CMAKE_DIR: /usr/lib/llvm-22/lib/cmake/llvm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up the scpp C++ toolchain
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-cxx-toolchain

      - name: Download the build tree
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        with:
          name: build-tree

      - name: Unpack the build tree
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: |
          set -euxo pipefail
          tar -xf build-tree.tar.gz
          rm -f build-tree.tar.gz
          built_in="$(cat build/.ci-workspace-path)"
          if [ "${built_in}" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::build tree was produced in ${built_in} but this job runs in ${GITHUB_WORKSPACE}; the absolute paths baked into CMakeCache.txt/CTestTestfile.cmake will not resolve"
            exit 1
          fi

      - name: Run unit tests
        if: needs.workflow-scope.outputs.docs_only != 'true'
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_TESTS: ${{ matrix.shard.tests }}
        run: |
          set -euo pipefail
          read -r -a shard_tests <<< "${SHARD_TESTS}"
          if [ "${#shard_tests[@]}" -eq 0 ]; then
            echo "::error::shard '${SHARD_NAME}' has no tests assigned to it"
            exit 1
          fi
          selector="^($(IFS='|'; echo "${shard_tests[*]}"))$"

          # `--no-tests=error` alone only catches a shard that selects
          # *nothing*; this also catches a shard that selects some but not all
          # of what it was assigned (a renamed test, say), which would
          # otherwise be a quietly smaller test run that still reports green.
          selected=$(ctest --test-dir build --show-only=json-v1 -R "${selector}" |
            python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tests"]))')
          if [ "${selected}" -ne "${#shard_tests[@]}" ]; then
            echo "::error::shard '${SHARD_NAME}' selected ${selected} test(s) but was assigned ${#shard_tests[@]} (${SHARD_TESTS})"
            exit 1
          fi

          ctest --test-dir build -R "${selector}" --no-tests=error --output-on-failure

  blackbox-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - workflow-scope
      - build
    env:
      CC: clang-22
      CXX: clang++-22
      LLVM_CMAKE_DIR: /usr/lib/llvm-22/lib/cmake/llvm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up the scpp C++ toolchain
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-cxx-toolchain

      - name: Download the build tree
        if: needs.workflow-scope.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        with:
          name: build-tree

      - name: Unpack the build tree
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: |
          set -euxo pipefail
          tar -xf build-tree.tar.gz
          rm -f build-tree.tar.gz
          built_in="$(cat build/.ci-workspace-path)"
          if [ "${built_in}" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::build tree was produced in ${built_in} but this job runs in ${GITHUB_WORKSPACE}; the blackbox runner's baked-in path to the scpp binary will not resolve"
            exit 1
          fi

      - name: Run blackbox suite
        if: needs.workflow-scope.outputs.docs_only != 'true'
        run: ./blackbox_test/build/run_tests

  # The single gate that stands in for everything above. It keeps the name
  # `build-and-test` deliberately: `main`'s branch protection requires the
  # status checks `build-and-test` and `docker-website-smoke` by name, so
  # letting `build-and-test` stop existing would leave every pull request
  # waiting forever on a check that can never report. Aggregating behind one
  # stable name also means the shard map above can be re-cut at any time
  # without having to re-edit branch protection to match new job names.
  #
  # `always()` plus an explicit result check, rather than a plain `needs:`,
  # because the default `needs:` behaviour would *skip* this job when
  # something upstream fails or is skipped -- and a skipped required check
  # never reports a conclusion at all. Running unconditionally and then
  # demanding `success` from every dependency turns "upstream failed",
  # "upstream was skipped" and "upstream was cancelled" all into a red
  # `build-and-test`, which is what a required check has to be.
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: always()
    needs:
      - workflow-scope
      - build
      - unit-tests
      - blackbox-tests
    steps:
      - name: Require every build and test job to have succeeded
        env:
          # `needs.unit-tests.result` is the matrix job's aggregate: it is
          # `success` only when every shard succeeded, so one red shard lands
          # here as a red gate.
          DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os

          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["DEPENDENCY_RESULTS"]).items()
          }
          for name in sorted(results):
              print(f"{name}: {results[name]}")

          failed = sorted(name for name, result in results.items() if result != "success")
          if failed:
              for name in failed:
                  print(f"::error::job '{name}' did not succeed (result: {results[name]})")
              raise SystemExit(1)

          print(f"all {len(results)} build and test jobs succeeded")
          PY

  docker-website-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: build-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Docker availability
        run: |
          set -euxo pipefail
          docker --version
          docker info

      - name: Build website image
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euxo pipefail
          build_args=()
          if [ -n "${SITE_BASE_URL}" ]; then
            build_args+=(--build-arg "SITE_BASE_URL=${SITE_BASE_URL}")
          fi
          docker build --pull "${build_args[@]}" -f website/Dockerfile -t scpp-website-ci .

      - name: Smoke test website container
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euxo pipefail
          container_name=scpp-website-smoke
          docker rm -f "${container_name}" >/dev/null 2>&1 || true
          cleanup() {
            docker logs "${container_name}" || true
            docker stop "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --rm --name "${container_name}" -p 18080:8080 scpp-website-ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          BASE = "http://127.0.0.1:18080/"
          CANONICAL_BASE = (os.environ.get("SITE_BASE_URL") or "https://www.scpp-lang.org").rstrip("/")
          MAX_SECOND_HOP_LINKS = 40

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.stylesheets = []
                  self.title = None
                  self._in_title = False
                  self._title_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and "href" in attrs:
                      self.hrefs.append(attrs["href"])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and "href" in attrs:
                      self.stylesheets.append(attrs["href"])
                  if tag == "title":
                      self._in_title = True
                      self._title_parts = []

              def handle_endtag(self, tag):
                  if tag == "title" and self._in_title:
                      self._in_title = False
                      self.title = "".join(self._title_parts).strip()

              def handle_data(self, data):
                  if self._in_title:
                      self._title_parts.append(data)

          def fetch(url):
              with urllib.request.urlopen(url) as response:
                  return response.status, response.headers.get("Content-Type", ""), response.read().decode("utf-8")

          def internal_links(page_url, html):
              parser = LinkParser()
              parser.feed(html)
              links = []
              for href in parser.hrefs:
                  if href.startswith("#"):
                      continue
                  url = urllib.parse.urljoin(page_url, href)
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme not in ("http", "https"):
                      continue
                  if parsed.netloc != urllib.parse.urlparse(BASE).netloc:
                      continue
                  links.append(url)
              return parser, links

          root_status, root_type, root_html = fetch(BASE)
          assert root_status == 200, root_status
          assert root_type.startswith("text/html"), root_type

          root_parser, root_links = internal_links(BASE, root_html)
          if root_parser.title != "SCPP Documentation Site":
              raise AssertionError(f"unexpected homepage title: {root_parser.title!r}")
          if not root_links:
              raise AssertionError("homepage exposed no links")
          if not root_parser.stylesheets:
              raise AssertionError("homepage exposed no stylesheet links")

          robots_status, robots_type, robots_body = fetch(urllib.parse.urljoin(BASE, "robots.txt"))
          assert robots_status == 200, robots_status
          expected_robots = f"User-agent: *\nAllow: /\nSitemap: {CANONICAL_BASE}/sitemap.xml\n"
          if robots_body != expected_robots:
              raise AssertionError(f"unexpected robots.txt contents: {robots_body!r}")

          sitemap_status, sitemap_type, sitemap_body = fetch(urllib.parse.urljoin(BASE, "sitemap.xml"))
          assert sitemap_status == 200, sitemap_status
          if "xml" not in sitemap_type:
              raise AssertionError(f"unexpected sitemap content type: {sitemap_type}")
          sitemap = ET.fromstring(sitemap_body)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [node.text for node in sitemap.findall("sm:url/sm:loc", ns)]
          if not locs:
              raise AssertionError("sitemap.xml exposed no URLs")
          if len(locs) != len(set(locs)):
              raise AssertionError("sitemap.xml exposed duplicate URLs")

          for loc in locs:
              if not loc or not loc.startswith(CANONICAL_BASE):
                  raise AssertionError(f"non-canonical sitemap URL: {loc!r}")
              parsed = urllib.parse.urlparse(loc)
              local_url = urllib.parse.urljoin(BASE, parsed.path.lstrip("/"))
              status, content_type, _ = fetch(local_url)
              if status != 200:
                  raise AssertionError(f"sitemap URL failed locally: {local_url} -> {status}")
              if parsed.path.endswith(".xml"):
                  if "xml" not in content_type:
                      raise AssertionError(f"sitemap URL returned wrong type: {local_url} -> {content_type}")
              elif not content_type.startswith("text/html"):
                  raise AssertionError(f"sitemap page returned wrong type: {local_url} -> {content_type}")

          for stylesheet_href in root_parser.stylesheets:
              stylesheet_url = urllib.parse.urljoin(BASE, stylesheet_href)
              status, content_type, _ = fetch(stylesheet_url)
              if status != 200 or not content_type.startswith("text/css"):
                  raise AssertionError(f"stylesheet fetch failed: {stylesheet_url} -> {status} {content_type}")

          seen = set()
          homepage_targets = []
          for url in root_links:
              if url not in seen:
                  seen.add(url)
                  homepage_targets.append(url)

          second_hop = []
          for url in homepage_targets:
              status, content_type, html = fetch(url)
              if status != 200:
                  raise AssertionError(f"homepage link failed: {url} -> {status}")
              if not content_type.startswith("text/html"):
                  raise AssertionError(f"homepage link returned non-html: {url} -> {content_type}")
              parser, links = internal_links(url, html)
              for nested in links:
                  if nested not in seen:
                      seen.add(nested)
                      second_hop.append(nested)
              if len(second_hop) >= MAX_SECOND_HOP_LINKS:
                  break

          for url in second_hop[:MAX_SECOND_HOP_LINKS]:
              status, content_type, _ = fetch(url)
              if status != 200:
                  raise AssertionError(f"nested link failed: {url} -> {status}")
              if url.endswith(".css"):
                  if not content_type.startswith("text/css"):
                      raise AssertionError(f"nested stylesheet returned wrong type: {url} -> {content_type}")
              else:
                  if not content_type.startswith("text/html"):
                      raise AssertionError(f"nested html link returned wrong type: {url} -> {content_type}")
          PY

  publish-website-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    # Unchanged from before the split, and still correct: `build-and-test` is
    # now the gate that demands success from the build job, every unit-test
    # shard and the blackbox job, so publishing still requires all of them to
    # be green. `needs` defaults to requiring success from everything listed,
    # and the `if` above adds a condition rather than replacing that
    # requirement -- it contains no job-status function (`always()`,
    # `failure()`, ...), so the implicit `success()` over `needs` still
    # applies and a failed or skipped dependency skips this job.
    needs:
      - build-and-test
      - docker-website-smoke
    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/website
      IMAGE_SHA_TAG: ${{ vars.DOCKER_USERNAME }}/website:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build website image
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euxo pipefail
          build_args=()
          if [ -n "${SITE_BASE_URL}" ]; then
            build_args+=(--build-arg "SITE_BASE_URL=${SITE_BASE_URL}")
          fi
          docker build --pull "${build_args[@]}" -f website/Dockerfile \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_SHA_TAG}" .

      - name: Push website image tags
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_SHA_TAG}"

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.SCPPWEBSITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SCPPWEBSITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SCPPWEBSITE_AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Report Azure CLI versions
        run: |
          az version
          az extension list -o table

      - name: Configure Azure Container App registry credentials
        run: |
          az containerapp registry set \
            --name scpp-website \
            --resource-group scpp \
            --server docker.io \
            --username "${{ secrets.SCPPWEBSITE_REGISTRY_USERNAME }}" \
            --password "${{ secrets.SCPPWEBSITE_REGISTRY_PASSWORD }}"

      - name: Deploy pinned image to Azure Container App
        run: |
          az containerapp update \
            --name scpp-website \
            --resource-group scpp \
            --image "${IMAGE_SHA_TAG}"
