manifest-version = 1

[package]
name = "scpp-project"
version = "0.1.0"

[dependencies]
std = { path = "../../libs/std" }
scpp-compiler = { path = ".." }
scpp-movecheck = { path = "../compiler/movecheck" }
scpp-codegen = { path = "../compiler/codegen" }
scpp-driver = { path = "../driver" }
llvm = { path = "../../libs/llvm" }

[[lib]]
name = "scpp-project"
sources = ["project.cppm"]
